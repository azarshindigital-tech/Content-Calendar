# Cloudflare Pages configuration
# Static assets live in ./public ; serverless API lives in ./functions
name = "monasebat-yar"
compatibility_date = "2026-09-01"
pages_build_output_dir = "public"

# Non-secret, public configuration. The AI model can be changed without code edits.
# Secrets (GEMINI_API_KEY) are NOT set here — they live in `.dev.vars` locally
# and in Cloudflare "Secrets" in production (see README).
[vars]
GEMINI_MODEL = "gemini-3.8-flash"
APP_TIMEZONE = "Asia/Tehran"
