# Cloudflare Worker (with static assets) configuration.
# The static site lives in ./public and is served via the ASSETS binding;
# src/index.js handles /api/suggest and delegates everything else to the assets.
name = "content-calendar"
main = "src/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

# Non-secret, public configuration. The AI model can be changed without code edits.
# Secrets (GEMINI_API_KEY) are NOT set here — they live in `.dev.vars` locally and
# as a Worker *Secret* in production (see README).
[vars]
GEMINI_MODEL = "gemini-3.8-flash"
APP_TIMEZONE = "Asia/Tehran"
